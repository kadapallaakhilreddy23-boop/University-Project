{% extends "base.html" %}
{% block title %}Faculty Login | {{ university_name }}{% endblock %}
{% block content %}
<section class="panel panel-elevated auth-panel" style="border-color: var(--ku-blue);">
    <h2>🎓 Faculty/Mentor Login</h2>
    <p>Quick access for faculty and mentors to manage their assigned students.</p>
    <form method="post">
        <label for="login_id">Faculty ID</label>
        <input id="login_id" name="login_id" type="text" placeholder="FACULTY001" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button class="btn" type="submit">Sign In</button>
    </form>
    <p class="muted" style="margin-top: 16px;">
        <small>This login is restricted to faculty and administrators only.</small>
    </p>
</section>

<style>
.auth-panel {
    max-width: 400px;
    margin: 40px auto;
}
</style>
{% endblock %}
