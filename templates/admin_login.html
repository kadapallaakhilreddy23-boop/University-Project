{% extends "base.html" %}
{% block title %}Admin Login | {{ university_name }}{% endblock %}
{% block content %}
<section class="panel panel-elevated auth-panel" style="border-color: var(--ku-red-bright);">
    <h2>🔧 Administrator Login</h2>
    <p>System administration access for managing users and settings.</p>
    <form method="post">
        <label for="login_id">Admin ID</label>
        <input id="login_id" name="login_id" type="text" placeholder="ADMIN001" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button class="btn" type="submit">Sign In</button>
    </form>
    <p class="muted" style="margin-top: 16px;">
        <small>This login is restricted to system administrators only.</small>
    </p>
</section>

<style>
.auth-panel {
    max-width: 400px;
    margin: 40px auto;
}
</style>
{% endblock %}
